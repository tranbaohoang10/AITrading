name: Prototype verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Lint, build, tests and dependency audit
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm test
          npm audit --audit-level=high

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - name: Verify wrapper integrity
        run: echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  backend/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Verification tools fail closed
        run: python3 -m unittest discover -s scripts -p 'test_verification_tools.py' -v
      - name: Independent DSL canonical fixtures
        run: python3 scripts/check_dsl_fixtures.py
      - name: Deterministic Python engine and adversarial tests
        run: python3 -m unittest discover -s python/tests -v
      - name: Backtest UI fixtures match the real engine
        run: python3 scripts/backtest_ui_fixtures.py --check
      - name: Prototype readiness and CNPM traceability
        run: python3 scripts/verify_readiness.py
      - name: Real PostgreSQL integration and build
        env:
          AITRADING_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 scripts/test_backend.py
      - name: Check all resolved Java dependencies
        run: python3 scripts/check_dependencies.py backend/build/reports/dependencies.txt backend/build/reports/dependency-audit.json
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-verification
          path: |
            backend/build/test-results/
            backend/build/reports/
          retention-days: 7
