spring.application.name=AiTrading
server.address=${AITRADING_BIND_ADDRESS:127.0.0.1}
server.port=${AITRADING_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=5s
spring.datasource.url=${AITRADING_DB_URL}
spring.datasource.username=${AITRADING_DB_USER}
spring.datasource.password=${AITRADING_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=5000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jdbc.template.query-timeout=2s
spring.flyway.schemas=trading
spring.flyway.default-schema=trading
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.servlet.multipart.enabled=false
spring.mvc.log-request-details=false
logging.level.org.springframework.jdbc=OFF
logging.level.com.zaxxer.hikari=OFF
logging.level.org.flywaydb=ERROR
