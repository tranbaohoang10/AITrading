spring.application.name=AiTrading
server.address=${AITRADING_BIND_ADDRESS:127.0.0.1}
server.port=${AITRADING_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=5s
spring.datasource.url=${AITRADING_DB_URL}
spring.datasource.username=${AITRADING_DB_USER}
spring.datasource.password=${AITRADING_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=5000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jdbc.template.query-timeout=2s
spring.flyway.schemas=trading
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2200KB
spring.flyway.default-schema=trading
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.servlet.multipart.enabled=true
spring.mvc.log-request-details=false
logging.level.org.springframework.jdbc=OFF
logging.level.com.zaxxer.hikari=OFF
logging.level.org.flywaydb=ERROR
# This logger embeds SQL in rollback exceptions. RequestIdFilter emits a redacted event instead.
logging.level.org.springframework.transaction.support.TransactionTemplate=OFF
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=trading.SPRING_SESSION
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=none
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.read.strict-duplicate-detection=true
spring.jackson.factory.constraints.read.max-nesting-depth=32
aitrading.allowed-origins=${AITRADING_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
aitrading.market.alpaca.key-id=${ALPACA_API_KEY_ID:}
aitrading.market.alpaca.secret-key=${ALPACA_API_SECRET_KEY:}
aitrading.market.capital.api-key=${CAPITAL_API_KEY:}
aitrading.market.capital.identifier=${CAPITAL_IDENTIFIER:}
aitrading.market.capital.password=${CAPITAL_API_PASSWORD:}
aitrading.market.capital.environment=${CAPITAL_ENVIRONMENT:demo}
aitrading.market.oanda.token=${OANDA_API_TOKEN:}
aitrading.market.oanda.account-id=${OANDA_ACCOUNT_ID:}
aitrading.market.oanda.environment=${OANDA_ENVIRONMENT:practice}
aitrading.market.ctrader.client-id=${CTRADER_CLIENT_ID:}
aitrading.market.ctrader.client-secret=${CTRADER_CLIENT_SECRET:}
aitrading.market.ctrader.access-token=${CTRADER_ACCESS_TOKEN:}
aitrading.market.ctrader.account-id=${CTRADER_ACCOUNT_ID:0}
aitrading.market.ctrader.environment=${CTRADER_ENVIRONMENT:demo}
aitrading.market.redis.enabled=${AITRADING_REDIS_ENABLED:false}
aitrading.market.twelve-data.api-key=${TWELVE_DATA_API_KEY:}
aitrading.market.catalog.scheduler=${AITRADING_CATALOG_SCHEDULER:true}
aitrading.market.catalog.initial-delay-ms=${AITRADING_CATALOG_INITIAL_DELAY_MS:2000}
aitrading.market.catalog.refresh-ms=${AITRADING_CATALOG_REFRESH_MS:21600000}
spring.data.redis.host=${AITRADING_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${AITRADING_REDIS_PORT:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
aitrading.market.news.api-key=${MARKET_NEWS_API_KEY:}
aitrading.market.calendar.api-key=${MARKET_CALENDAR_API_KEY:}
